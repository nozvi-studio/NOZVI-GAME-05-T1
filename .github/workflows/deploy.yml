name: Deploy to GitHub Pages

# Tests, type-checks and builds the game, then publishes `dist/` to GitHub Pages.
# Runs on pushes to master and on demand (Actions tab -> Run workflow, pick a branch).
# The work branch is listed so the build can be previewed before it is merged; remove it after the merge.
on:
  push:
    branches: [master, claude/confident-faraday-owprnf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run cancels the one still queued or running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Relative base so the game works under https://<owner>.github.io/<repo>/.
      - run: npx vite build --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
