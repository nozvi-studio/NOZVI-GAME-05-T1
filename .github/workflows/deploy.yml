name: Deploy to GitHub Pages

# Tests, type-checks and builds the game, then publishes `dist/` to the `gh-pages` branch.
# Settings -> Pages must use: Deploy from a branch -> gh-pages -> / (root).
# Runs on pushes to master and on demand (Actions tab -> Run workflow).
# The work branch is listed so a build can be previewed before it is merged.
on:
  push:
    branches: [master, claude/confident-faraday-owprnf]
  workflow_dispatch:

# Pushing the gh-pages branch needs write access to repository contents.
permissions:
  contents: write

# One publish at a time; a newer run cancels the one still queued or running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Relative base so the game works under https://<owner>.github.io/<repo>/.
      - run: npx vite build --base=./
      # The gh-pages branch only ever holds the latest build; it is force-pushed on purpose.
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
